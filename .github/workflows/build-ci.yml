name: Build CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Clone and build frontend for feature branches
      - name: Clone and build frontend
        if: github.event_name == 'workflow_dispatch' || contains(github.ref, 'feature/')
        run: |
          echo "=== Starting frontend build ==="
          pwd
          ls -la
          
          # Clone frontend from user's fork
          FRONTEND_REPO="https://github.com/wutongxx-droid/plain-web.git"
          FRONTEND_BRANCH="${{ github.ref_name }}"
          
          echo "Cloning frontend from $FRONTEND_REPO branch $FRONTEND_BRANCH"
          git clone --depth 1 --branch "$FRONTEND_BRANCH" "$FRONTEND_REPO" ../plain-web-temp || \
            git clone --depth 1 --branch main "$FRONTEND_REPO" ../plain-web-temp
          
          ls -la ../plain-web-temp
          
          cd ../plain-web-temp
          pwd
          
          # Fix package.json to remove packageManager requirement
          sed -i '/"packageManager"/d' package.json
          
          echo "=== Running npm install ==="
          npm install
          
          echo "=== Running npm run build ==="
          npm run build
          
          echo "=== Build output ==="
          ls -la dist/
          
          # Copy frontend build to Android project
          mkdir -p ${{ github.workspace }}/app/src/main/resources/web
          cp -r dist/* ${{ github.workspace }}/app/src/main/resources/web/
          
          echo "=== Verifying web resources ==="
          ls -la ${{ github.workspace }}/app/src/main/resources/web/
          
          echo "Frontend built and copied to resources/web"
        shell: bash

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - run: chmod +x ./gradlew

      # Build debug APK (support multiple architectures: arm64 + x86_64)
      # This builds the Android app with embedded frontend for feature branches
      - name: Build debug APK
        run: |
          # Build arm64-v8a (64-bit ARM for real devices)
          ./gradlew assembleGithubDebug
          
          # Build x86_64 (for emulator)
          ./gradlew assembleGithubDebug -PabiFilters=x86_64
          
          # List all output files
          find app/build/outputs -name "*.apk" 2>/dev/null || echo "No APK found"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: |
            app/build/outputs/apk/github/debug/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn