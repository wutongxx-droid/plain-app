name: Build Debug APK

on:
  push:
    branches:
      - feature/**
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - run: chmod +x ./gradlew

      # Build arm64-v8a (default)
      - name: Build arm64-v8a APK
        run: ./gradlew assembleGithubDebug

      - name: Build x86_64 APK (for emulator)
        run: ./gradlew assembleGithubDebug -PabiFilters=x86_64

      - name: List build outputs
        run: |
          ls -la app/build/outputs/apk/github/debug/
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64
          path: app/build/outputs/apk/github/debug/app-github-debug.apk

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-x86_64
          path: app/build/outputs/apk/github/debug/app-github-debug-x86_64.apk